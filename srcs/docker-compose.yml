services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:v1
    container_name: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file: .env
    secrets:
      - db_password
      - db_root_password
  nginx:
    build: ./requirements/nginx
    image: nginx:v1
    env_file: .env
    container_name: nginx
    restart: always
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html
  wordpress:
    env_file: .env
    build: ./requirements/wordpress
    image: wordpress:v1
    container_name: wordpress
    restart: always
    networks:
      - inception
    secrets:
      - db_password
      - wp_password_admin
      - wp_password_user
    volumes:
      - wp_data:/var/www/html



volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress


networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/.db_password
  db_root_password:
    file: ../secrets/.db_root_password
  wp_password_admin:
    file: ../secrets/.wp_password_admin
  wp_password_user:
    file: ../secrets/.wp_password_user
